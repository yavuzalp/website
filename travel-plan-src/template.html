<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="{{DESCRIPTION}}" />
        <!-- Unlisted: not linked from any nav, not in a sitemap (none exists on this
             site), and excluded from search indexing. Reachable only via direct URL.
             Do not add a nav link to this page anywhere else in the site, and do not
             remove this meta tag — see travel-plan-src/README.md. -->
        <meta name="robots" content="noindex, nofollow" />
        <title>{{TITLE}}</title>
        <!-- Anti-flash: set theme before first paint (site-wide nav follows this; the
             trip content below always renders in its own fixed dark theme regardless —
             see the .travel-plan-page rules further down). -->
        <script>!function(){var t=localStorage.getItem('theme-pref')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}();</script>
        <link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico" />
        <!-- Google Analytics -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-JLZPGN2LXD"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-JLZPGN2LXD');
        </script>
        <script src="https://use.fontawesome.com/releases/v5.15.1/js/all.js" crossorigin="anonymous"></script>
        <link href="https://fonts.googleapis.com/css?family=Saira+Extra+Condensed:500,700" rel="stylesheet" type="text/css" />
        <link href="https://fonts.googleapis.com/css?family=Muli:400,400i,800,800i" rel="stylesheet" type="text/css" />
        <link href="/css/styles.css" rel="stylesheet" />
        <link href="/css/futuristic.css" rel="stylesheet" />
        {{HEAD_EXTRA}}
        <style>
            /* ── Travel Plan page layout (sits below the fixed top navbar) ── */
            #page-content {
                margin-left: 0;
                margin-top: 60px;
            }

            /* ══════════════════════════════════════════════════════════════
               Everything below is auto-generated by
               scripts/build-travel-plan.js from the source document's own
               <style> block — scoped under .travel-plan-page and defensively
               !important'd on color/background/font-family so it can't leak
               out (generic names like .row/.box would otherwise collide with
               Bootstrap) and can't be overridden by the site's own global
               !important color rules on h1–h6/p/li. Do not hand-edit this
               block — edit the source file and re-run the build script.
               ══════════════════════════════════════════════════════════════ */
{{SCOPED_STYLE}}
        </style>
    </head>
    <body id="page-top" class="topnav">
        <!-- Navigation (same as other topnav pages). Deliberately NOT adding a
             "Travel Plan" item here — this page is unlisted by design. -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top" id="sideNav">
            <a class="navbar-brand" href="/">
                <span class="d-block d-lg-none">Yavuzalp <span class="brand-accent">Turkoglu</span></span>
                <span class="d-none d-lg-block" aria-hidden="true"></span>
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/#about">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="/#projects">Projects</a></li>
                    <li class="nav-item"><a class="nav-link" href="/halal-scanner/">Halal Scanner</a></li>
                    <li class="nav-item"><a class="nav-link" href="/interview-prep/">Interview Prep</a></li>
                </ul>
            </div>
            <button class="theme-toggle" id="theme-toggle" title="Switch to dark mode" aria-label="Toggle dark/light mode">
                <i class="fas fa-moon" id="theme-icon"></i>
            </button>
        </nav>

        <!-- Page content -->
        <div id="page-content">
            <div class="travel-plan-page">
{{BODY}}
            </div>
        </div>

        <!-- Bootstrap core JS -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/js/theme.js"></script>
    </body>
</html>
